[tool.poetry]
name = "apex-trading"
version = "4.0.0"
description = "APEX Trading System v4.0 — World-Class Algorithmic Trading"
authors = ["APEX Team"]
readme = "README.md"
packages = [{ include = "shared" }, { include = "services" }]

[tool.poetry.dependencies]
python = "^3.12"

# Core async
uvloop = "^0.19"
asyncio-throttle = "^1.0"

# Market Data
ccxt = "^4.3"
websockets = "^12.0"
aiohttp = "^3.9"
playwright = "^1.44"

# Technical Analysis
pandas-ta = "^0.3.14b"
ta-lib = "^0.4.28"
scipy = "^1.13"
numpy = "^1.26"
pandas = "^2.2"

# Machine Learning
hmmlearn = "^0.3"
xgboost = "^2.0"
lightgbm = "^4.3"
scikit-learn = "^1.4"
optuna = "^3.6"
joblib = "^1.4"
shap = "^0.45"
river = "^0.21"  # online learning for drift detection

# NLP & Sentiment
transformers = "^4.41"
torch = "^2.3"
feedparser = "^6.0"
newspaper3k = "^0.2.8"

# Calibration
imbalanced-learn = "^0.12"

# Data Storage
asyncpg = "^0.29"          # TimescaleDB (PostgreSQL)
redis = {extras = ["hiredis"], version = "^5.0"}
clickhouse-driver = "^0.2.7"
boto3 = "^1.34"            # MinIO (S3-compatible)

# API & Messaging
fastapi = "^0.111"
pydantic = "^2.7"
pydantic-settings = "^2.3"
uvicorn = {extras = ["standard"], version = "^0.29"}
celery = {extras = ["redis"], version = "^5.4"}

# AI Audit Layer
anthropic = "^0.28"
openai = "^1.30"

# Monitoring
prometheus-client = "^0.20"
sentry-sdk = {extras = ["fastapi"], version = "^2.5"}
structlog = "^24.2"

# Security
hvac = "^2.1"  # HashiCorp Vault

# Utilities
python-dotenv = "^1.0"
httpx = "^0.27"
tenacity = "^8.3"         # retry logic
orjson = "^3.10"          # fast JSON

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
black = "^24.4"
ruff = "^0.4"
mypy = "^1.10"
hypothesis = "^6.103"     # property-based testing

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=shared --cov=services --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
